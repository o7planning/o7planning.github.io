<h1> faColors.selection.rowNormal </h1>
<p>
  Đây là màu nền mặc định của một dòng (row) trong bảng hoặc danh sách khi ở trạng thái nghỉ, không có sự tương tác.
  Nó thường trùng với màu <code>faColors.selection.surface.base</code> hoặc <code>faColors.selection.surface.container</code> để tạo sự liền mạch cho giao diện.
</p>
