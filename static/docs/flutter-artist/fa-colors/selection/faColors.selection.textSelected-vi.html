
<h1> faColors.selection.textSelected </h1>
<p>
  Màu chữ dành riêng cho dòng ở trạng thái <code>faColors.selection.rowSelected</code>.
  Vì nền của dòng chọn thường dùng hiệu ứng pha trộn màu, <code>faColors.selection.textSelected</code> được tính toán để không bị "chìm" vào màu nền, đảm bảo thông tin quan trọng luôn sắc nét.
</p>
