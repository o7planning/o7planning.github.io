
<h1> faColors.selection.inkCurrent </h1>
<p>
  Màu chữ dành cho dòng đang ở trạng thái <code>faColors.selection.rowCurrent</code>.
  Tương tự như <code>faColors.selection.inkSelected</code>, nó giúp duy trì sự tập trung thị giác vào dòng đang được điều hướng, đảm bảo tính nhất quán giữa nền và nội dung.
</p>
