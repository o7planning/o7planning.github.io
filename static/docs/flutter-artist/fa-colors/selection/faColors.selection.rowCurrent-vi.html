

<h1> faColors.selection.rowCurrent </h1>
<p>
  Xác định màu nền cho dòng đang được tập trung (Focus) bởi con trỏ hoặc bàn phím.
  Trong triết lý FlutterArtist, <code>faColors.selection.rowCurrent</code> giúp người dùng biết họ đang điều hướng ở đâu, ngay cả khi dòng đó chưa được thực hiện hành động "chọn".
</p>
