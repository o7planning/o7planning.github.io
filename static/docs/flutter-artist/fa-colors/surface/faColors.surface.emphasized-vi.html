

<h1> faColors.surface.emphasized </h1>
<p>
  Màu nền dành cho các thành phần cần "nổi" lên trên cùng hoặc có độ ưu tiên thị giác cao nhất (Floating elements).
  Sự kết hợp giữa màu này và <code>faColors.border.subtle</code> giúp các thành phần như Dialog hoặc Popup trở nên cực kỳ sắc nét và chuyên nghiệp.
</p>
